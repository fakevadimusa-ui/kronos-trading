name: Kronos Trading Bot

# Fires at 6:35 AM PT year-round.
# 13:35 UTC = 6:35 AM PDT (Apr–Nov). 14:35 UTC = 6:35 AM PST (Nov–Mar).
# has_open_position() makes both triggers idempotent on DST transition days.
on:
  schedule:
    - cron: '35 13 * * 1-5'
    - cron: '35 14 * * 1-5'
  workflow_dispatch:

jobs:
  nvda:
    name: NVDA Signal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trading repo
        uses: actions/checkout@v4

      - name: Clone Kronos model code
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git Kronos

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-hf-small-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NVDA bot
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kronos_alpaca_paper.py
        continue-on-error: true

  crudeoil:
    name: CL=F Signal
    runs-on: ubuntu-latest
    needs: nvda
    steps:
      - name: Checkout trading repo
        uses: actions/checkout@v4

      - name: Clone Kronos model code
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git Kronos

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-hf-small-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CL=F bot
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kronos_alpaca_crudeoil.py
        continue-on-error: true

  monitor:
    name: Morning Snapshot
    runs-on: ubuntu-latest
    needs: [nvda, crudeoil]
    if: always()
    steps:
      - name: Checkout trading repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EOD monitor
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kronos_monitor.py
        continue-on-error: true
